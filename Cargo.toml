[package]
name = "eotexrip"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.88"
description = "Native Etrian Odyssey 3DS texture extraction and organization"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd", "dep:wgpu"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
png = "0.18"
walkdir = "2.5"
cityhasher = "0.1"
fs2 = "0.4"
eframe = { version = "0.33.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["dx12"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "eotexrip"
path = "src/bin/cli.rs"

[[bin]]
name = "EO-Texrip"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true
